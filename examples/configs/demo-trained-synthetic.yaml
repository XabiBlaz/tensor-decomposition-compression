seed: 0
task: classification
num_classes: 3
model:
  source: torchvision
  name: resnet18
  weights: null
  task: classification
  kwargs:
    num_classes: 3
data:
  kind: synthetic
  count: 96
  size: 32
  batch_size: 8
training:
  epochs: 3
  learning_rate: 0.001
analysis:
  level: validated
  backend: pytorch
  target_size_mb: 40.0
  quality_metric: top1
  max_quality_loss: 0.02
  include: [layer4.1.conv2, fc]
  max_samples: 16
  max_spatial_size: 8
  max_validated_per_layer: 2
  candidate_grid:
    linear:
      methods: [svd, weighted_svd]
      ranks: [1, 2]
    conv2d:
      methods: [partial_tucker]
      rank_ratios: [0.5, 0.75]
    quantization:
      enabled: false
    gated_mlp:
      methods: []
benchmark:
  input_shape: [1, 3, 32, 32]
  warmup: 3
  iterations: 20
  threads: 2
