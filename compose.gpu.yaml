services:
  ui:
    build:
      context: .
      dockerfile: containers/ui-gpu.Dockerfile
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Opt in only for a verified legacy-driver compatibility exception.
      NVIDIA_DISABLE_REQUIRE: "${NVIDIA_DISABLE_REQUIRE:-false}"
